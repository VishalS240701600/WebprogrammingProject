<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard · RideBuddy</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%9A%97%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header id="site-header"></header>
  <main class="container">
    <div class="between page-title"><h1 style="margin:0">Dashboard</h1><a class="btn" href="post-ride.html">+ Post a ride</a></div>
    <div class="tabs" role="tablist">
      <button role="tab" id="tab-posted" aria-selected="true" aria-controls="panel-posted">My posted rides</button>
      <button role="tab" id="tab-requested" aria-selected="false" aria-controls="panel-requested">My requested rides</button>
    </div>
    <section id="panel-posted" role="tabpanel" aria-labelledby="tab-posted"></section>
    <section id="panel-requested" role="tabpanel" aria-labelledby="tab-requested" class="hidden"></section>
  </main>
  <div id="dialog-holder"></div>
  <p class="footer">RideBuddy · a web programming class project</p>
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/rating.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>
