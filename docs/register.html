<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign up · RideBuddy</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%9A%97%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header id="site-header"></header>
  <main class="container" style="max-width:520px">
    <h1 class="page-title">Create your account</h1>
    <form id="form" class="card" novalidate>
      <div class="field"><label for="name">Full name</label><input id="name" type="text" maxlength="80" autocomplete="name" required></div>
      <div class="field"><label for="email">Email</label><input id="email" type="email" autocomplete="email" required></div>
      <div class="field"><label for="password">Password</label><input id="password" type="password" minlength="8" maxlength="72" autocomplete="new-password" required><div class="hint">At least 8 characters.</div></div>
      <div class="row">
        <div class="field"><label for="phone">Phone (optional)</label><input id="phone" type="tel" maxlength="20" autocomplete="tel"></div>
        <div class="field"><label for="organization">College / company</label><input id="organization" type="text" maxlength="120"></div>
      </div>
      <button class="btn block" type="submit">Sign up</button>
      <p class="hint" style="margin-top:12px">Already registered? <a href="login.html">Log in</a></p>
    </form>
  </main>
  <p class="footer">RideBuddy · a web programming class project</p>
  <script src="js/config.js"></script>
  <script src="js/local-api.js"></script>
  <script src="js/api.js"></script>
  <script src="js/register.js"></script>
</body>
</html>
